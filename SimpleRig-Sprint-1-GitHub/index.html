<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101216"><title>SimpleRig</title><link rel="stylesheet" href="./src/styles.css"></head><body><div class="app-shell"><header class="topbar"><div class="brand"><div class="brand-mark">S</div><div><div class="brand-title">SimpleRig</div><div class="brand-subtitle">Sprint 1 · Core editor</div></div></div><div class="project-fields"><label>Project<input id="projectName" value="Untitled Rig"></label><label>Gag<input id="gagName" placeholder="Gag name"></label></div><div class="top-actions"><button id="undoBtn">↶</button><button id="redoBtn">↷</button><button id="saveBtn">Save</button><label class="file-button">Open<input id="openInput" type="file" accept=".rig,.json,application/json"></label></div></header><main class="workspace-layout"><aside class="left-panel"><section><h2>Objects</h2><button class="tool-card" data-add="pulley"><span class="tool-icon pulley-icon"></span><span>Single pulley</span></button><button class="tool-card" data-add="doublePulley"><span class="tool-icon double-pulley-icon"></span><span>Double pulley</span></button><button class="tool-card" data-add="performer"><span class="tool-icon">✣</span><span>Performer</span></button><button class="tool-card" data-add="truss"><span class="tool-icon">▱</span><span>Truss</span></button><button class="tool-card" data-add="telehandler"><span class="tool-icon">▰</span><span>Telehandler</span></button></section><section><h2>View</h2><div class="view-tabs"><button class="view-tab active" data-view="2d">TOP</button><button class="view-tab" data-view="front">FRONT</button><button class="view-tab" data-view="left">LEFT</button><button class="view-tab" data-view="3d">3D</button></div></section><section class="help"><h2>Controls</h2><p><strong>2D:</strong> drag objects. Wheel/pinch zoom. Drag empty space to pan.</p><p><strong>3D:</strong> drag to orbit. Shift-drag to pan. Wheel/pinch zoom.</p></section></aside><section class="canvas-area"><canvas id="mainCanvas"></canvas><div id="viewBadge" class="view-badge">TOP</div><div id="status" class="status">Ready</div></section><aside class="right-panel"><section><h2>Selection</h2><div id="emptySelection" class="empty-selection">Select an object</div><div id="selectionEditor" class="selection-editor hidden"><label>Name<input id="objectLabel"></label><div class="field-grid"><label>X (m)<input id="objectX" type="number" step="0.1"></label><label>Y (m)<input id="objectY" type="number" step="0.1"></label><label>Z (m)<input id="objectZ" type="number" step="0.1"></label><label>Rotation<input id="objectRotation" type="number" step="5"></label><label>Scale<input id="objectScale" type="number" step="0.1" min="0.2"></label></div><div class="selection-actions"><button id="duplicateBtn">Duplicate</button><button id="deleteBtn" class="danger">Delete</button></div></div></section><section><h2>Scene</h2><div id="sceneList" class="scene-list"></div></section></aside></main></div><script type="module" src="./src/app.js"></script></body></html>
