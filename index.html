<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Rig Plan Designer</title>
<style>
  :root{--bg:#f3f4f6;--panel:#fff;--card:#f9fafb;--border:#d1d5db;--text:#111827;--muted:#6b7280;--accent:#2563eb;--accentText:#fff}
  *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
  #rigApp{padding:12px}.layout{display:grid;grid-template-columns:175px minmax(0,1fr) 230px;gap:10px;align-items:start}
  .panel{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:10px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
  button,input,select,label.fileBtn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;padding:7px 9px;font-size:14px}
  button,label.fileBtn{cursor:pointer}button.active,button.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
  .assetGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.asset{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;text-align:center;padding:6px}
  .asset svg,.asset img{width:34px;height:34px;object-fit:contain;pointer-events:none}.canvasWrap{border:1px solid var(--border);border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--card)}
  #rigCanvas{width:100%;height:100%;display:block;touch-action:none;background:#fff;background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.06) 1px,transparent 1px);background-size:25px 25px}
  .group{display:grid;gap:7px;margin-bottom:12px}.title{font-weight:600;font-size:14px;margin-bottom:7px}.small{font-size:12px;color:var(--muted);line-height:1.35}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--card)}.metric b{display:block;font-size:17px}
  .full{width:100%}.hiddenInput{display:none}.divider{height:1px;background:var(--border);margin:10px 0}.rig-handle{cursor:grab;touch-action:none}.rig-handle:active{cursor:grabbing}.rig-hit{cursor:pointer}
  @media(max-width:760px){.layout{grid-template-columns:1fr}.assetGrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rig Plan">
<link rel="apple-touch-icon" href="icons/icon-180.png">

</head>
<body>
<div id="rigApp">
  <div class="panel toolbar">
    <button id="selectTool" class="active" type="button">Select</button><button id="lineTool" type="button">Line</button><button id="arrowTool" type="button">Arrow</button><button id="textTool" type="button">Text</button>
    <button id="addRigLineBtn" class="primary" type="button">Add rig line</button><button id="duplicateBtn" type="button">Duplicate</button><button id="deleteBtn" type="button">Delete</button><button id="undoBtn" type="button">Undo</button><button id="redoBtn" type="button">Redo</button>
  </div>
  <div class="layout">
    <aside class="panel"><div class="title">Built-in icons</div><div id="builtins" class="assetGrid"></div><div class="divider"></div><div class="title">Custom icons</div>
      <div class="group"><input id="customName" class="full" type="text" placeholder="Icon name"><label class="fileBtn full" for="customFile">Choose image</label><input id="customFile" class="hiddenInput" type="file" accept="image/png,image/jpeg,image/webp"><button id="addCustomBtn" type="button">Add to toolbar</button></div><div id="customAssets" class="assetGrid"></div>
    </aside>
    <section><div class="canvasWrap"><svg id="rigCanvas" viewBox="0 0 1000 750" aria-label="Rig plan drawing canvas"><g id="backgroundLayer"></g><g id="rigLineLayer"></g><g id="drawingLayer"></g><g id="selectionLayer"></g></svg></div><p id="status" class="small" aria-live="polite">Both ends of each rig line have draggable nodes. Select a line to change its colour.</p></section>
    <aside class="panel">
      <div class="title">Background</div><div class="group"><label class="fileBtn full" for="backgroundFile">Upload background</label><input id="backgroundFile" class="hiddenInput" type="file" accept="image/*"><label>Opacity<input id="backgroundOpacity" class="full" type="range" min="0.1" max="1" step="0.05" value="1"></label><button id="removeBackground" type="button">Remove background</button></div>
      <div class="title">Rig line</div><div class="group"><label>Line colour<input id="rigLineColour" class="full" type="color" value="#111827"></label></div>
      <div class="title">Selected object</div><div class="group"><label>Name<input id="objectName" class="full" type="text"></label><label>Role<select id="objectRole" class="full"><option value="unassigned">Unassigned</option><option value="fixed">Fixed pulley</option><option value="travelling">Travelling/load pulley</option><option value="redirect">Redirect pulley</option><option value="assist">Haul-assist pulley</option></select></label><label>Load weight (kg)<input id="objectWeight" class="full" type="number" min="0" step="0.1"></label><label>Rotation<input id="rotation" class="full" type="range" min="-180" max="180" value="0"></label><label>Scale<input id="scale" class="full" type="range" min="0.2" max="4" step="0.05" value="1"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><button id="attachBtn" class="primary" type="button">Attach to rig line</button><button id="attachEndBtn" type="button">Attach to end</button></div><button id="detachBtn" type="button">Detach from rig line</button></div>
      <div class="divider"></div><div class="title">Weight calculator</div><div class="group"><label>Load weight (kg)<input id="loadWeight" class="full" type="number" min="0" step="0.1" value="300"></label><label>Main system ratio<select id="mainRatio" class="full"><option value="1">1:1</option><option value="2">2:1</option><option value="3" selected>3:1</option><option value="4">4:1</option><option value="5">5:1</option><option value="6">6:1</option></select></label><label>Haul-assist ratio<select id="assistRatio" class="full"><option value="1">None / 1:1</option><option value="2" selected>2:1 assist</option><option value="3">3:1 assist</option><option value="4">4:1 assist</option></select></label><label>Overall efficiency (%)<input id="efficiency" class="full" type="number" min="10" max="100" value="85"></label></div>
      <div class="metrics"><div class="metric"><span class="small">Main rope tension</span><b id="mainTension">100 kgf</b></div><div class="metric"><span class="small">Ideal operator pull</span><b id="idealPull">50 kgf</b></div><div class="metric"><span class="small">Estimated operator pull</span><b id="practicalPull">58.8 kgf</b></div><div class="metric"><span class="small">180° assist pulley</span><b id="assistPulleyLoad">117.6 kgf</b></div></div>
    </aside>
  </div>
</div>
<script>
(() => {
try {
  const NS='http://www.w3.org/2000/svg',svg=document.getElementById('rigCanvas'),rigLayer=document.getElementById('rigLineLayer'),drawing=document.getElementById('drawingLayer'),selection=document.getElementById('selectionLayer'),background=document.getElementById('backgroundLayer'),status=document.getElementById('status');
  let selected=null,selectedRig=null,drag=null,activeHandle=null;
  const icons={Winch:'<rect x="10" y="25" width="80" height="50" rx="8"/><circle cx="50" cy="50" r="16"/><path d="M20 25V10M80 25V10M25 84h50"/>',Pulley:'<circle cx="50" cy="52" r="31"/><circle cx="50" cy="52" r="9"/><path d="M50 21V4M42 4h16"/>','Double pulley':'<circle cx="35" cy="53" r="23"/><circle cx="65" cy="53" r="23"/><circle cx="35" cy="53" r="6"/><circle cx="65" cy="53" r="6"/><path d="M50 28V7M42 7h16"/>','Tie-off':'<circle cx="50" cy="50" r="36"/><path d="M18 78L82 22M22 22l56 56M32 50h36"/>',Performer:'<circle cx="50" cy="14" r="10"/><path d="M50 24v31M28 38l22 10 22-10M50 55L31 91M50 55l19 36"/>',Truss:'<rect x="8" y="24" width="84" height="52"/><path d="M8 24l84 52M92 24L8 76M36 24v52M64 24v52"/>','Rope grab':'<path d="M20 16v68M80 16v68M20 35h60M20 65h60"/><circle cx="50" cy="50" r="13"/>',Anchor:'<path d="M50 8v68M34 22h32M18 58c5 21 17 32 32 32s27-11 32-32M18 58l17 5M82 58l-17 5"/><circle cx="50" cy="14" r="7"/>',Camera:'<rect x="13" y="27" width="55" height="46" rx="6"/><circle cx="41" cy="50" r="14"/><path d="M68 39l20-11v44L68 61M25 27l7-12h18l7 12"/>',Telehandler:'<circle cx="26" cy="75" r="12"/><circle cx="72" cy="75" r="12"/><path d="M15 63h68V45H57l-8-20H30v38M58 45l27-29M85 16h10v12H82"/>'};
  function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
  function uid(){return Math.random().toString(36).slice(2,9)}
  function addRigLine(){const n=rigLayer.querySelectorAll('[data-rig="true"]').length,y=300+n*55,g=document.createElementNS(NS,'g');g.dataset.rig='true';g.dataset.id=uid();g.dataset.colour='#111827';g.dataset.points=JSON.stringify([{x:180,y},{x:820,y}]);const hit=document.createElementNS(NS,'polyline');hit.setAttribute('fill','none');hit.setAttribute('stroke','transparent');hit.setAttribute('stroke-width','28');hit.classList.add('rig-hit');hit.addEventListener('pointerdown',e=>{e.stopPropagation();selectRig(g)});const path=document.createElementNS(NS,'polyline');path.setAttribute('fill','none');path.setAttribute('stroke','#111827');path.setAttribute('stroke-width','6');path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');path.dataset.visible='true';path.addEventListener('pointerdown',e=>{e.stopPropagation();selectRig(g)});g.append(hit,path);g.append(makeHandle(g.dataset.id,0,180,y),makeHandle(g.dataset.id,1,820,y));rigLayer.appendChild(g);renderRig(g);selectRig(g)}
  function makeHandle(rid,index,x,y){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','15');c.setAttribute('fill','#2563eb');c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','4');c.classList.add('rig-handle');c.dataset.rigId=rid;c.dataset.pointIndex=index;c.addEventListener('pointerdown',e=>{e.stopPropagation();const rig=rigLayer.querySelector(`[data-id="${rid}"]`);selectRig(rig);activeHandle=c;try{svg.setPointerCapture(e.pointerId)}catch(_){}});return c}
  function selectRig(g){selectedRig=g;document.getElementById('rigLineColour').value=g.dataset.colour||'#111827';rigLayer.querySelectorAll('[data-rig="true"]').forEach(r=>r.querySelectorAll('.rig-handle').forEach(h=>h.setAttribute('fill',r===g?'#2563eb':'#6b7280')));status.textContent='Rig line selected. Drag either end node or change its colour.'}
  function renderRig(g){const points=JSON.parse(g.dataset.points),pointString=points.map(p=>`${p.x},${p.y}`).join(' ');g.querySelectorAll('polyline').forEach(p=>p.setAttribute('points',pointString));g.querySelector('[data-visible="true"]').setAttribute('stroke',g.dataset.colour||'#111827');g.querySelectorAll('.rig-handle').forEach(h=>{const p=points[+h.dataset.pointIndex];h.setAttribute('cx',p.x);h.setAttribute('cy',p.y)});drawing.querySelectorAll(`[data-rig-id="${g.dataset.id}"]`).forEach(el=>{const p=points[+el.dataset.controlIndex];if(p){el.dataset.x=p.x;el.dataset.y=p.y;applyTransform(el)}})}
  function nearestSegment(x,y){let best=null;rigLayer.querySelectorAll('[data-rig="true"]').forEach(rig=>{const points=JSON.parse(rig.dataset.points);for(let i=0;i<points.length-1;i++){const a=points[i],b=points[i+1],dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;let t=((x-a.x)*dx+(y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));const px=a.x+t*dx,py=a.y+t*dy,d=Math.hypot(x-px,y-py);if(!best||d<best.d)best={rig,segmentIndex:i,p:{x:px,y:py},d}}});return best}
  function nearestEndpoint(x,y){let best=null;rigLayer.querySelectorAll('[data-rig="true"]').forEach(rig=>{const points=JSON.parse(rig.dataset.points);[0,points.length-1].forEach(index=>{const p=points[index],d=Math.hypot(x-p.x,y-p.y);if(!best||d<best.d)best={rig,index,p,d}})});return best}
  function attachEndSelected(){if(!selected){status.textContent='Select an icon first.';return}if(selected.dataset.rigId)detachSelected();const near=nearestEndpoint(+selected.dataset.x,+selected.dataset.y);if(!near){status.textContent='Add a rig line first.';return}selected.dataset.rigId=near.rig.dataset.id;selected.dataset.controlIndex=near.index;selected.dataset.attachMode='end';selected.dataset.x=near.p.x;selected.dataset.y=near.p.y;applyTransform(selected);drawSelection();selectRig(near.rig);status.textContent='Icon attached to a rig-line end. Drag it toward another end to snap across.'}
  function snapEndAttachedObject(){if(!selected||selected.dataset.attachMode!=='end')return;const near=nearestEndpoint(+selected.dataset.x,+selected.dataset.y);if(!near)return;selected.dataset.rigId=near.rig.dataset.id;selected.dataset.controlIndex=near.index;selected.dataset.x=near.p.x;selected.dataset.y=near.p.y;applyTransform(selected);drawSelection();selectRig(near.rig);status.textContent='Icon snapped to the nearest rig-line end.'}
  function attachSelected(){if(!selected){status.textContent='Select an icon first.';return}if(selected.dataset.rigId){status.textContent='This icon is already attached.';return}const near=nearestSegment(+selected.dataset.x,+selected.dataset.y);if(!near){status.textContent='Add a rig line first.';return}const points=JSON.parse(near.rig.dataset.points),index=near.segmentIndex+1;points.splice(index,0,{x:near.p.x,y:near.p.y});near.rig.dataset.points=JSON.stringify(points);drawing.querySelectorAll(`[data-rig-id="${near.rig.dataset.id}"]`).forEach(other=>{if(+other.dataset.controlIndex>=index)other.dataset.controlIndex=+other.dataset.controlIndex+1});selected.dataset.rigId=near.rig.dataset.id;selected.dataset.controlIndex=index;selected.dataset.attachMode='line';selected.dataset.x=near.p.x;selected.dataset.y=near.p.y;renderRig(near.rig);drawSelection();selectRig(near.rig);status.textContent='Icon attached. Drag it to manipulate the rig line.'}
  function detachSelected(){if(!selected||!selected.dataset.rigId){status.textContent='Selected icon is not attached.';return}const rig=rigLayer.querySelector(`[data-id="${selected.dataset.rigId}"]`),index=+selected.dataset.controlIndex;if(rig){const points=JSON.parse(rig.dataset.points);if(index>0&&index<points.length-1)points.splice(index,1);rig.dataset.points=JSON.stringify(points);drawing.querySelectorAll(`[data-rig-id="${rig.dataset.id}"]`).forEach(other=>{if(other!==selected&&+other.dataset.controlIndex>index)other.dataset.controlIndex=+other.dataset.controlIndex-1});renderRig(rig)}delete selected.dataset.rigId;delete selected.dataset.controlIndex;delete selected.dataset.attachMode;status.textContent='Icon detached from rig line.'}
  function addIcon(name,markup,data){const g=document.createElementNS(NS,'g');Object.assign(g.dataset,{object:'true',name,role:'unassigned',weight:'0',x:'500',y:'375',rotation:'0',scale:'1'});const holder=document.createElementNS(NS,'g');holder.setAttribute('transform','translate(-50 -50)');if(data){const im=document.createElementNS(NS,'image');im.setAttribute('href',data);im.setAttribute('width','100');im.setAttribute('height','100');holder.appendChild(im)}else{const s=document.createElementNS(NS,'g');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','5');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.innerHTML=markup;holder.appendChild(s)}g.appendChild(holder);drawing.appendChild(g);bindIcon(g);select(g);applyTransform(g);status.textContent='Icon added. Use Attach to rig line if required.'}
  function bindIcon(g){g.addEventListener('pointerdown',e=>{e.stopPropagation();select(g);const p=pt(e);drag={start:p,x:+g.dataset.x,y:+g.dataset.y};try{svg.setPointerCapture(e.pointerId)}catch(_){}})}
  function applyTransform(g){g.setAttribute('transform',`translate(${g.dataset.x} ${g.dataset.y}) rotate(${g.dataset.rotation}) scale(${g.dataset.scale})`)}
  function select(g){selected=g;document.getElementById('objectName').value=g.dataset.name||'';document.getElementById('objectRole').value=g.dataset.role||'unassigned';document.getElementById('objectWeight').value=g.dataset.weight||0;document.getElementById('rotation').value=g.dataset.rotation||0;document.getElementById('scale').value=g.dataset.scale||1;drawSelection()}
  function drawSelection(){selection.innerHTML='';if(!selected)return;let b;try{b=selected.getBBox()}catch{return}const r=document.createElementNS(NS,'rect');r.setAttribute('x',b.x-6);r.setAttribute('y',b.y-6);r.setAttribute('width',b.width+12);r.setAttribute('height',b.height+12);r.setAttribute('transform',selected.getAttribute('transform'));r.setAttribute('fill','none');r.setAttribute('stroke','#2563eb');r.setAttribute('stroke-width','3');r.setAttribute('stroke-dasharray','8 6');selection.appendChild(r)}
  svg.addEventListener('pointerdown',()=>{selection.innerHTML='';selected=null});svg.addEventListener('pointermove',e=>{const p=pt(e);if(activeHandle){const rig=rigLayer.querySelector(`[data-id="${activeHandle.dataset.rigId}"]`),points=JSON.parse(rig.dataset.points);points[+activeHandle.dataset.pointIndex]={x:p.x,y:p.y};rig.dataset.points=JSON.stringify(points);renderRig(rig);return}if(drag&&selected){const x=drag.x+p.x-drag.start.x,y=drag.y+p.y-drag.start.y;if(selected.dataset.rigId&&selected.dataset.attachMode!=='end'){const rig=rigLayer.querySelector(`[data-id="${selected.dataset.rigId}"]`),points=JSON.parse(rig.dataset.points);points[+selected.dataset.controlIndex]={x,y};rig.dataset.points=JSON.stringify(points);renderRig(rig)}else{selected.dataset.x=x;selected.dataset.y=y;applyTransform(selected);drawSelection()}}});function stopDrag(){if(drag&&selected&&selected.dataset.attachMode==='end')snapEndAttachedObject();drag=null;activeHandle=null}svg.addEventListener('pointerup',stopDrag);svg.addEventListener('pointercancel',stopDrag);window.addEventListener('pointerup',stopDrag)
  function renderIcons(){const host=document.getElementById('builtins');Object.entries(icons).forEach(([name,markup])=>{const b=document.createElement('button');b.type='button';b.className='asset';b.innerHTML=`<svg viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">${markup}</g></svg><span>${name}</span>`;b.addEventListener('click',()=>addIcon(name,markup));host.appendChild(b)})}
  document.getElementById('addRigLineBtn').addEventListener('click',addRigLine);document.getElementById('attachBtn').addEventListener('click',attachSelected);document.getElementById('attachEndBtn').addEventListener('click',attachEndSelected);document.getElementById('detachBtn').addEventListener('click',detachSelected);document.getElementById('rigLineColour').addEventListener('input',e=>{if(!selectedRig){status.textContent='Select a rig line first.';return}selectedRig.dataset.colour=e.target.value;renderRig(selectedRig)});
  document.getElementById('addCustomBtn').addEventListener('click',()=>{const name=document.getElementById('customName').value.trim(),file=document.getElementById('customFile').files[0];if(!name||!file)return;const r=new FileReader();r.onload=()=>{const b=document.createElement('button');b.type='button';b.className='asset';b.innerHTML=`<img src="${r.result}" alt=""><span>${name}</span>`;b.addEventListener('click',()=>addIcon(name,'',r.result));document.getElementById('customAssets').appendChild(b)};r.readAsDataURL(file)});
  document.getElementById('backgroundFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{background.innerHTML=`<image id="backgroundImage" href="${r.result}" x="0" y="0" width="1000" height="750" preserveAspectRatio="xMidYMid slice" pointer-events="none" opacity="${document.getElementById('backgroundOpacity').value}"/>`;status.textContent='Background uploaded.'};r.readAsDataURL(file)});document.getElementById('backgroundOpacity').addEventListener('input',e=>document.getElementById('backgroundImage')?.setAttribute('opacity',e.target.value));document.getElementById('removeBackground').addEventListener('click',()=>background.innerHTML='');
  document.getElementById('objectName').addEventListener('input',e=>{if(selected)selected.dataset.name=e.target.value});document.getElementById('objectRole').addEventListener('change',e=>{if(selected)selected.dataset.role=e.target.value});document.getElementById('objectWeight').addEventListener('input',e=>{if(selected)selected.dataset.weight=e.target.value});document.getElementById('rotation').addEventListener('input',e=>{if(selected){selected.dataset.rotation=e.target.value;applyTransform(selected);drawSelection()}});document.getElementById('scale').addEventListener('input',e=>{if(selected){selected.dataset.scale=e.target.value;applyTransform(selected);drawSelection()}});
  function calc(){const load=+document.getElementById('loadWeight').value||0,main=+document.getElementById('mainRatio').value||1,assist=+document.getElementById('assistRatio').value||1,eff=Math.max(.1,(+document.getElementById('efficiency').value||100)/100),mainTension=load/main,ideal=mainTension/assist,practical=ideal/eff;document.getElementById('mainTension').textContent=mainTension.toFixed(1)+' kgf';document.getElementById('idealPull').textContent=ideal.toFixed(1)+' kgf';document.getElementById('practicalPull').textContent=practical.toFixed(1)+' kgf';document.getElementById('assistPulleyLoad').textContent=(practical*2).toFixed(1)+' kgf'}['loadWeight','mainRatio','assistRatio','efficiency'].forEach(id=>document.getElementById(id).addEventListener('input',calc));renderIcons();addRigLine();calc();
} catch (error) { console.error(error); const s=document.getElementById('status'); if(s) s.textContent='Startup error: '+error.message; }
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js').catch(function (error) {
      console.warn('Service worker registration failed:', error);
    });
  });
}
</script>

</body>
</html>
